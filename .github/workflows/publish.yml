name: publish

# Publishes the package to npm through Trusted Publishing (OIDC): no long-lived
# token and no interactive 2FA. One-time setup on npmjs.com:
#   Package -> Settings -> Trusted publishing -> GitHub Actions
#   owner: <github user>  repository: dsh-dokuwiki  workflow: publish.yml
# After that, pushing a `v*` tag publishes automatically (with provenance).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC exchange with the npm registry

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.
      - run: npm install -g npm@latest

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "package.json version: $PKG_VERSION | tag: $GITHUB_REF_NAME"
          test "v$PKG_VERSION" = "$GITHUB_REF_NAME"

      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
